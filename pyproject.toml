[project]
name = "vehicle-splat"
version = "0.1.0"
description = "Turns a van's Imagin renders into a 3D Gaussian splat the customer portal can turn to any angle."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "pillow>=10",
  "imageio[ffmpeg]>=2.34",
  # The image pins the CUDA build (Dockerfile); gsplat is installed there too, from
  # its prebuilt wheels, and imported only where training needs it.
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vehicle-splat = "vehicle_splat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vehicle_splat = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
